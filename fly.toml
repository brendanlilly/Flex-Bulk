# Flex Bulk on Fly.io, behind a login. Secrets (fly secrets set): WEBB_SITE_PASSWORD (everyone), WEBB_ADMIN_PASSWORD
# (the settings dashboard), WEBB_SESSION_SECRET, and ANTHROPIC_API_KEY if handwriting should be read. See README.
app = "flex-bulk"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  WEBB_DATA_DIR = "/data"
  WEBB_CLAUDE_DAILY_CALLS = "1000"   # Claude API calls per UTC day (handwriting); past it, photos aren't read

[mounts]
  source = "flex_bulk_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "600s"
    interval = "30s"
    timeout = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"
